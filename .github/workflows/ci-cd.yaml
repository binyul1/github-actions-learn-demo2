name: Backend CI/CD
on:
  push:
    branches:
      - main

jobs:
  unit-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run unit tests
        run: PYTHONPATH=backend pytest backend/tests -v

  build: 
    runs-on: self-hosted
    environment: test
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            binyul11/github-actions-learn-demo2:latest
            binyul11/github-actions-learn-demo2:${{ github.sha }}
            binyul11/github-actions-learn-demo2:${{ github.run_number }}
  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run docker compose
        run: docker compose up -buid